<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>左右走动 · 素材对照</title>
<style>
:root{color-scheme:dark;--bg:#152025;--surface:#24343a;--line:#516268;--ink:#ede9de;--muted:#b9c5c7;--accent:#edcd8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:26px;margin:0 0 8px}h2{font-size:20px;margin:0}p{max-width:68ch;color:var(--muted);margin:8px 0 16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:44px;padding:8px 16px;touch-action:manipulation;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:active{background:#41535a}button[aria-pressed=true]{background:var(--accent);color:var(--bg)}.directions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}article{min-width:0;border-top:1px solid var(--line);padding-top:16px}canvas{width:100%;display:block;image-rendering:pixelated;background:#34454b}output{display:block;color:var(--accent);font-size:14px;min-height:28px;padding:4px 0}.still{display:grid;grid-template-columns:1fr 1fr;gap:8px}figure{margin:0}figcaption{font-size:14px;color:var(--muted);padding:8px 0}.note{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}a{color:var(--accent);display:inline-block;min-height:44px;padding:8px 0}.hint{font-size:14px}label{display:flex;align-items:center;gap:8px}@media(max-width:640px){body{padding:16px}.directions{grid-template-columns:1fr;gap:24px}h1{font-size:24px}}
</style><main><h1>左右走动效果对照</h1><p>先看连续走动的整体感觉。下面提供两张迈步帧供比较；是否影响体验、是否可以接受，由你判断。</p><nav aria-label="播放设置"><label>人物<select id="actor"><option value="nora">摄影师 · 诺拉</option><option value="mara">店主 · 玛拉</option></select></label><label>大小<select id="scale"><option value="0.32">接近游戏大小</option><option value="0.625">放大查看</option></select></label><button id="play" aria-pressed="true">暂停</button><button id="step">下一帧</button><button id="travel" aria-pressed="true">横向移动：开</button></nav><p class="hint">每格约 208 毫秒，与居民正常慢走切帧间隔相同。可以暂停、逐帧看，也可以关掉横移看原地脚步。下方单帧始终放大。</p><div class="directions" id="directions"></div><p id="status" role="status">正在读取图集…</p><p class="note">这里只裁切、播放已去底的原有图集，没有镜像造出另一条腿，也没有重新画动作。可以关掉横移，专门看脚步；小瑕疵是否可接受，仍以正常游戏尺度为准。</p><a href="http://localhost:5463/?shop_art=pixel&shop_environment=whole">返回主游戏</a></main>
<script type="module">
const entries={nora:'./baseline-reference/actor-atlas.png',mara:'../oldstreet-laundry-redesign/pose-preserving/actor-atlas.png'};
let source=null,step=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,travel=true,last=null,elapsed=0,frameTime=0,loadVersion=0;
const sequence=[0,1,2,1],views=[],status=document.querySelector('#status');
for(const [title,row,sign] of [['向左',1,-1],['向右',2,1]]){const article=document.createElement('article'),heading=document.createElement('h2'),canvas=document.createElement('canvas'),out=document.createElement('output'),stills=document.createElement('div');heading.textContent=title;canvas.width=480;canvas.height=224;canvas.setAttribute('aria-label',title+'连续步态');stills.className='still';const comparisons=[];for(const [col,label] of [[0,'第 1 列 · 迈步帧 A'],[2,'第 3 列 · 迈步帧 B']]){const figure=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');c.width=200;c.height=220;c.setAttribute('aria-label',title+label);caption.textContent=label;figure.append(c,caption);stills.append(figure);comparisons.push({c,col})}article.append(heading,canvas,out,stills);document.querySelector('#directions').append(article);views.push({canvas,out,row,sign,comparisons})}
function sprite(ctx,col,row,x,y,w,h){ctx.imageSmoothingEnabled=false;ctx.drawImage(source,col*320,row*352,320,352,x,y,w,h)}
function movingDraw(){if(!source)return;const scale=Number(document.querySelector('#scale').value);for(const {canvas,out,row,sign,comparisons} of views){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,480,224);ctx.strokeStyle='#647578';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,206);ctx.lineTo(480,206);ctx.stroke();const phase=(elapsed*24*scale/.22)%224,x=travel?(sign>0?phase:224-phase):(480-320*scale)/2;sprite(ctx,sequence[step],row,x,206-328*scale,320*scale,352*scale);out.textContent='第 '+(sequence[step]+1)+' 列 · '+['迈步 A','站姿','迈步 B','站姿'][step];for(const {c,col} of comparisons){const cc=c.getContext('2d');cc.clearRect(0,0,200,220);sprite(cc,col,row,0,0,200,220)}}}
async function load(){const version=++loadVersion;source=null;status.textContent='正在读取图集…';const img=new Image();img.onload=()=>{if(version!==loadVersion)return;source=img;step=0;elapsed=0;frameTime=0;status.textContent='图集已就绪；两张迈步帧保留原始差异。';movingDraw()};img.onerror=()=>{if(version===loadVersion)status.textContent='图集读取失败，请刷新页面重试。'};img.src=entries[document.querySelector('#actor').value]}
function sync(){document.querySelector('#play').textContent=playing?'暂停':'播放';document.querySelector('#play').setAttribute('aria-pressed',String(playing))}
document.querySelector('#scale').addEventListener('change',movingDraw);document.querySelector('#actor').addEventListener('change',load);document.querySelector('#play').addEventListener('click',()=>{playing=!playing;sync()});document.querySelector('#step').addEventListener('click',()=>{playing=false;step=(step+1)%4;sync();movingDraw()});document.querySelector('#travel').addEventListener('click',e=>{travel=!travel;e.currentTarget.textContent='横向移动：'+(travel?'开':'关');e.currentTarget.setAttribute('aria-pressed',String(travel));movingDraw()});function tick(now){const dt=last===null?0:Math.min((now-last)/1000,.1);last=now;if(playing&&source){elapsed+=dt;frameTime+=dt;while(frameTime>=.208333){frameTime-=.208333;step=(step+1)%4}movingDraw()}requestAnimationFrame(tick)}sync();load();requestAnimationFrame(tick);
</script></html>
