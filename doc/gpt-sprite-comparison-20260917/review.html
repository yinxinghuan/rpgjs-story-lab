<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物生成对照 · 三次独立样本</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#152025;color:#e7e5dc;font:16px/1.65 system-ui,sans-serif}main{max-width:1080px;margin:auto}h1{font-size:26px;margin:0 0 8px}p{color:#b7c1c1}button,a{touch-action:manipulation}button{font:inherit;min-height:44px;padding:8px 18px;border:1px solid #657b7c;border-radius:7px;background:#25393c;color:#fff;cursor:pointer}button[aria-pressed=true]{background:#debb76;color:#172024}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{padding:16px;background:#203035;border:1px solid #46565a;border-radius:10px}h2{font-size:18px;margin:0 0 8px}canvas{width:100%;image-rendering:pixelated;background:repeating-conic-gradient(#1b292e 0% 25%,#26383d 0% 50%) 0/20px 20px}a{display:inline-block;min-height:44px;padding:8px 0;color:#eed09b}output{display:block;color:#bac6c6;font-size:14px}small{display:block;margin-top:20px;color:#b7c1c1}
</style><main><h1>同参考、同提示词，重复生成三次</h1><p>检查朝向、腿脚与摆臂；这是放大的素材预览，尚未代表游戏内动作验收。所有原图保留，画布只裁切格子，不修正动作。</p><nav aria-label="查看方向"><button data-row="0" aria-pressed="true">正面</button><button data-row="1" aria-pressed="false">向左</button><button data-row="2" aria-pressed="false">向右</button><button data-row="3" aria-pressed="false">背面</button><button id="play" aria-pressed="true">暂停播放</button><button id="step">下一帧</button></nav><div class="grid" id="samples"></div><small>每格约200毫秒，按第1→2→3→2列播放；第1、3列是否真正左右交替需人工检查；图片保留原始背景。GPT工具未暴露底层模型编号。平台对照为同一参考图片内容、同提示词的一次结果；两种工具的尺寸控制不同，不属于严格模型基准。</small></main><script type="module">
const entries=[['GPT · 第1次','gpt-01.png'],['GPT · 第2次','gpt-02.png'],['GPT · 第3次','gpt-03.png'],['平台 · 本轮参考','../oldstreet-laundry-redesign/pose-preserving/candidate.png']];let row=0,playing=true,step=0,last=0;const samples=[];
for(const [label,url] of entries){const card=document.createElement('article');const h=document.createElement('h2');h.textContent=label;const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const out=document.createElement('output');out.textContent='读取原图…';const link=document.createElement('a');link.textContent='查看原图';link.href=url;link.target='_blank';card.append(h,canvas,out,link);document.querySelector('#samples').append(card);const image=new Image();image.onload=()=>{samples.push({image,ctx:canvas.getContext('2d'),out});draw()};image.onerror=()=>out.textContent='原图未能读取';image.src=url;}
function draw(){const frame=[0,1,2,1][step];for(const {image,ctx,out} of samples){const w=image.naturalWidth/3,h=image.naturalHeight/4;ctx.clearRect(0,0,256,256);ctx.imageSmoothingEnabled=false;const ratio=Math.min(256/w,256/h);ctx.drawImage(image,frame*w,row*h,w,h,(256-w*ratio)/2,(256-h*ratio)/2,w*ratio,h*ratio);out.textContent=['正面','向左','向右','背面'][row]+' · 第'+(frame+1)+'列';}}
document.querySelectorAll('[data-row]').forEach(b=>b.addEventListener('click',()=>{row=Number(b.dataset.row);step=0;document.querySelectorAll('[data-row]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()}));document.querySelector('#play').addEventListener('click',e=>{playing=!playing;e.currentTarget.textContent=playing?'暂停播放':'播放动作';e.currentTarget.setAttribute('aria-pressed',String(playing));});document.querySelector('#step').addEventListener('click',()=>{playing=false;step=(step+1)%4;document.querySelector('#play').textContent='播放动作';document.querySelector('#play').setAttribute('aria-pressed','false');draw()});function tick(now){if(playing&&now-last>=200){step=(step+1)%4;last=now;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
