<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>腿部图层动作对照</title>
<style>
:root{font:16px/1.6 system-ui,sans-serif;color:#e9e9df;background:#18242b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:900px;margin-inline:auto}h1{font-size:24px}h2{font-size:18px}p{max-width:65ch}button,select{font:inherit;min-height:48px;padding:8px 16px;border:1px solid #a69b77;border-radius:4px;background:#243640;color:inherit}button:focus-visible,select:focus-visible{outline:3px solid #f1d08a;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.controls label{display:flex;gap:8px;align-items:center;min-height:48px}.comparison{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px;margin-block:24px}.view{width:320px;height:320px;position:relative;background:white;overflow:hidden;max-width:100%}.cell{width:320px;height:320px;overflow:hidden;position:absolute;left:0;top:0;transform-origin:155px 160px}.cell img{position:absolute;width:640px;height:320px;max-width:none;pointer-events:none;user-select:none;image-rendering:pixelated}.assembled{width:320px;height:362px;position:relative;background:white;overflow:hidden}.assembled-legs{position:absolute;left:99px;top:208px;width:320px;height:320px;transform:scale(.4);transform-origin:0 0}.assembled-body{position:absolute;left:-20px;top:0;width:362px;height:278px;overflow:hidden}.assembled-body img{position:absolute;left:-362px;top:-1086px;width:1086px;height:1448px;max-width:none;image-rendering:pixelated}.axis{position:absolute;left:155px;top:0;height:320px;border-left:1px dashed #a83838;pointer-events:none}.floor{position:absolute;left:0;right:0;top:305px;border-top:1px dashed #a83838;pointer-events:none}figure{margin:0}figcaption{margin-top:8px}.warning{border-left:3px solid #d7b76b;padding-left:16px}output{font-variant-numeric:tabular-nums}@media(max-width:370px){body{padding:12px}.view{transform:scale(.9);transform-origin:top left;margin-bottom:-32px}}
</style></head><body>
<h1>背面腿部图层：原始两帧与受控镜像</h1>
<p>使用同一份平台生成候选。左边交替显示模型原始两格；右边只显示第一格，并围绕固定髋部中心翻转腿部图层。图片文件没有被修改。</p>
<div class="controls"><button id="play" aria-pressed="false">播放</button><button id="step">下一姿态</button><label>每个姿态 <select id="speed"><option value="600">600 毫秒</option><option value="300">300 毫秒</option><option value="150">150 毫秒</option></select></label><label><input type="checkbox" id="hip"> 固定髋部上方65像素</label><output id="phase" aria-live="polite">姿态 1</output></div>
<div class="comparison"><figure><h2>模型原始两格</h2><div class="view" role="img" aria-label="模型原始腿部姿态"><div class="cell"><img id="raw" src="./candidate.png" alt=""></div><i class="axis"></i><i class="floor"></i></div><figcaption>检查：是否总是画面左脚更低；髋部和鞋底是否跳动。</figcaption></figure>
<figure><h2>第一格与镜像交替</h2><div class="view" role="img" aria-label="镜像交替腿部姿态"><div class="cell" id="mirror"><img src="./candidate.png" alt=""></div><div class="cell" id="fixed-hip" style="height:65px;display:none"><img src="./candidate.png" alt=""></div><i class="axis"></i><i class="floor"></i></div><figcaption>固定镜像轴 x=155，鞋底参考 y=305。检查：臀部接缝、衣褶和鞋面光照是否翻跳。</figcaption></figure></div>
<figure><h2>固定上半身与候选腿部装配</h2><div class="assembled" role="img" aria-label="完整人物分层装配候选"><div class="assembled-legs"><div class="cell" id="assembled-leg"><img src="./candidate.png" alt=""></div></div><div class="assembled-body"><img src="./hero.png" alt=""></div></div><figcaption>上半身取正式背面站立帧，完全固定；腿部只在显示时交替镜像。下摆附近的旧裤腿残留、比例、连接与明暗仍需检查。白色底色暂不代表透明度通过。</figcaption></figure>
<p class="warning">这是只读图层装配实验，不是真实地图移动。没有站立过渡帧；不能证明走路自然。背包、胸前带子、徽章、单侧装备及不对称服装不得跟随镜像。四方向、上半身接缝与实际地图脚点仍需分别验证。</p>
<script>
let phase=0,playing=false,timer;const raw=document.getElementById('raw'),mirror=document.getElementById('mirror'),play=document.getElementById('play'),speed=document.getElementById('speed');
function draw(){raw.style.left=(-phase*320)+'px';mirror.style.transform=phase?'scaleX(-1)':'none';document.getElementById('assembled-leg').style.transform=phase?'scaleX(-1)':'none';document.getElementById('phase').textContent='姿态 '+(phase+1)}
function run(){clearInterval(timer);play.textContent=playing?'暂停':'播放';play.setAttribute('aria-pressed',String(playing));if(playing)timer=setInterval(()=>{phase=1-phase;draw()},Number(speed.value))}
document.getElementById('hip').onchange=function(){document.getElementById('fixed-hip').style.display=this.checked?'block':'none';mirror.style.clipPath=this.checked?'inset(65px 0 0 0)':'none'};
play.onclick=()=>{playing=!playing;run()};document.getElementById('step').onclick=()=>{playing=false;run();phase=1-phase;draw()};speed.onchange=run;document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;run()}});draw();
</script></body></html>
